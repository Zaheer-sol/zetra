services:
  - type: pserv
    name: zetra-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w @zetra/api
    envVars:
      - fromGroup: zetra-production-secrets
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 4000
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: zetra-postgres
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: zetra-postgres
          property: connectionString
      - key: WEB_ORIGIN
        fromService:
          name: zetra-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_APP_URL
        fromService:
          name: zetra-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEAR_TESTNET_ENABLED
        value: "true"
      - key: NEAR_TESTNET_START_HEIGHT
        sync: false
      - key: NEAR_TESTNET_USDC_CONTRACT_ID
        value: usdc.fakes.testnet
      - key: WEBHOOK_ALLOW_PRIVATE_URLS
        value: "false"

  - type: worker
    name: zetra-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w @zetra/worker
    envVars:
      - fromGroup: zetra-production-secrets
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zetra-postgres
          property: connectionString
      - key: NEAR_TESTNET_ENABLED
        value: "true"
      - key: NEAR_TESTNET_START_HEIGHT
        fromService:
          name: zetra-api
          type: pserv
          envVarKey: NEAR_TESTNET_START_HEIGHT
      - key: NEAR_TESTNET_USDC_CONTRACT_ID
        value: usdc.fakes.testnet

  - type: web
    name: zetra-web
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w @zetra/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_INTERNAL_URL
        fromService:
          name: zetra-api
          type: pserv
          property: hostport
      - key: API_INTERNAL_PROTOCOL
        value: http

databases:
  - name: zetra-postgres
    databaseName: zetra
    user: zetra_owner
    postgresMajorVersion: "17"

envVarGroups:
  - name: zetra-production-secrets
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: APP_DB_PASSWORD
        generateValue: true
